<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/vendor/aos.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/dash.css">
    <title>Reset password — OMG Universe</title>
</head>
<body class="page-light account-page auth-page">

<header class="header header--dark">
    <a class="header__brand" href="account.html" aria-label="OMG Universe — account">
        <img class="header__logo" src="assets/icons/logo.svg" alt="OMG" width="68" height="40">
    </a>

</header>

<main class="acc auth-screen" data-acc data-auth-page="recovery">
    <div class="acc__inner auth-screen__inner">
        <div class="acc__card auth-screen__card">
            <p class="acc__label" data-auth-label>My account</p>
            <h1 class="acc__title">Reset <span>password</span></h1>
            <p class="acc__text" data-acc-lost-intro>Enter the email address associated with your account.</p>
            <form class="acc__form" method="post" data-acc-lost>
                <div class="acc__field">
                    <label for="recovery-email">Email</label>
                    <input id="recovery-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="acc__actions"><button type="submit">Request reset link</button></div>
            </form>
            <p class="acc__success" data-acc-lost-done tabindex="-1" hidden>Demo request completed. Email delivery requires a connected account service.</p>
            <p class="acc__switch"><a class="acc__link-btn" href="login.html" data-auth-link>Back to login</a></p>
        </div>
    </div>
</main>
<script src="js/account.js"></script>
</body>
</html>
